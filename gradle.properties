# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 4 GB heap: R8 minification of the release build (enabled 2026-07-11) needs well more than the
# old 2 GB — CI packaging workers failed inside the daemon at 2 GB.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Memory settings for a full `./gradlew assemble`, which is the only build that compiles all eight
# app variants (standard/x86_64 x debug/release/benchmark/non-minified) from scratch.
#
# The Kotlin compile daemon is a separate JVM and inherits org.gradle.jvmargs when this is unset.
# Eight full Compose compilations at once do not fit in 4 GB: the daemon died, Kotlin fell back to
# compiling in-process, and that then exhausted the Gradle daemon too. The first symptom of it was an
# OutOfMemoryError raised inside the compiler's own error printer (DumpIrTreeVisitor), which reads
# like a code error rather than a memory one.
kotlin.daemon.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
# Gradle defaults max workers to the CPU count (20 here) and the configuration cache lets it run
# tasks of the SAME project in parallel, so a clean assemble started all eight Kotlin compilations
# simultaneously. Capping the leases bounds peak compiler memory; day-to-day builds
# (:app:assembleStandardRelease) never have more than two Kotlin tasks to run anyway, so this costs
# them nothing.
org.gradle.workers.max=4
# A crashed Kotlin daemon must fail the build, not silently retry the compilation inside the Gradle
# daemon — that fallback is what turned one out-of-memory daemon into a cascade of failed tasks.
kotlin.daemon.useFallbackStrategy=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Reuse task outputs across builds, not just within one. The configuration cache above skips the
# configuration phase; this skips the *execution* of tasks whose inputs are unchanged, so switching
# branches or reverting an experiment restores an already-built result instead of recompiling it.
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.nonTransitiveRClass=false
