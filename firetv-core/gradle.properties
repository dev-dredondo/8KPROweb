# Project-wide Gradle settings for the OwnTV core library.

# 4 GB heap, matching the apps. Room's KSP round over ~60 entities and the Compose compiler on the
# core module both want more than the 2 GB default.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate JVM and inherits org.gradle.jvmargs when this is unset.
kotlin.daemon.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
# Bounds peak compiler memory when both modules compile at once.
org.gradle.workers.max=4
# A crashed Kotlin daemon must fail the build, not silently retry the compilation inside the Gradle
# daemon — that fallback turns one out-of-memory daemon into a cascade of failed tasks.
kotlin.daemon.useFallbackStrategy=false
# Skip the configuration phase when nothing that affects it changed.
org.gradle.configuration-cache=true
# Reuse task outputs across builds, not just within one.
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# NOTE: `android.nonTransitiveRClass=false` is deliberately NOT set here. It belongs to the
# consuming app — the TV app has ~2000 `R.string.*` call sites that resolve against core's
# resources only because it is false there. Inside this repo, :player-core imports
# `tv.own.owntv.core.R` explicitly, which is the non-transitive style and needs no such flag.
